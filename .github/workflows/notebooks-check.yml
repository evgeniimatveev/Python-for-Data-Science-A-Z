name: Notebook check

# Static checks only: validates the notebooks, it does not execute them (see notebooks-run.yml for that).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Validate every notebook (nbformat, widgets, code syntax) + file-name hygiene
        run: uv run --no-project --with nbformat python .github/scripts/check_notebooks.py

      - name: Quickstart script runs
        run: python 00-quickstart/hello_data_science.py

      - name: Datasets are present
        run: |
          test -s data/demographic-data.csv
          test -s data/movie-ratings.csv
          test -s data/basketball-dataset.docx
